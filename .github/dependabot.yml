version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/lab"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
    groups:
      docker-images:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:45"
    allow:
      - dependency-type: "direct"
    groups:
      python-deps:
        patterns:
          - "*"
    insecure-external-code-execution: "deny"
    open-pull-requests-limit: 3
