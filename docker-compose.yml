# Intentional insecure lab. Bind published ports to localhost.
# Compare with the standalone file docker-compose.hardened.yml.
# Do not merge the two files: Compose would keep privileged, socket, and host-root keys.

name: docker-hacking-lab

networks:
  lab-external:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  lab-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.22.0.0/24

services:

  attacker:
    image: kalilinux/kali-rolling
    container_name: attacker
    hostname: attacker
    labels:
      lab.role: workstation
      lab.module: "0,1,2"
    networks:
      - lab-external
      - lab-internal
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    stdin_open: true
    tty: true
    restart: "no"

  vuln-web:
    image: php:7.4-apache
    container_name: vuln-web
    hostname: vuln-web
    labels:
      lab.role: insecure
      lab.module: "2,5,7"
      lab.finding: docker-socket-mount
    networks:
      - lab-external
      - lab-internal
    ports:
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:8080:80"
    volumes:
      - ./lab/www:/var/www/html:ro
      # Teaching misconfiguration: Docker API equivalent to host root.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      DB_PASSWORD: SuperSecret123!
    healthcheck:
      test: ["CMD-SHELL", "pidof apache2 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: "no"

  internal-db:
    image: postgres:13-alpine
    container_name: internal-db
    hostname: internal-db
    labels:
      lab.role: insecure
      lab.module: "9"
    networks:
      - lab-internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-corporate_secrets}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-corporate_secrets}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

  registry:
    image: registry:2
    container_name: registry
    hostname: registry
    labels:
      lab.role: insecure
      lab.module: "7,8"
      lab.finding: unauthenticated-registry
    networks:
      - lab-internal
    ports:
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:5000:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/v2/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: "no"

  escape-target-privileged:
    image: ubuntu:20.04
    container_name: escape-target-privileged
    hostname: escape-privileged
    labels:
      lab.role: insecure
      lab.module: "3"
      lab.finding: privileged
    networks:
      - lab-internal
    privileged: true
    init: true
    command: sleep infinity
    restart: "no"

  escape-target-hostmount:
    image: ubuntu:20.04
    container_name: escape-target-hostmount
    hostname: escape-hostmount
    labels:
      lab.role: insecure
      lab.module: "4"
      lab.finding: host-root-mount
    networks:
      - lab-internal
    volumes:
      - /:/host:rw
    init: true
    command: sleep infinity
    restart: "no"

  defender-hardened:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: defender-hardened
    hostname: defender-hardened
    labels:
      lab.role: secure-baseline
      lab.module: "10,11"
    networks:
      - lab-internal
    ports:
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:9002:8080"
    cap_drop:
      - ALL
    read_only: true
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: "no"
